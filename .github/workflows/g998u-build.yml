name: g998u-port-build
# Track: https://github.com/Jean7z/dfroot-g998u/blob/g998u-port/g998u/PLAN.md
#
# Árbol kernel: drop oficial Samsung OSRC HZB1 (Kernel.tar.gz, release asset 'osrc-hzb1'),
# validado localmente contra la config real del device (5899/5906 opciones retenidas).
# Vermagic objetivo: 5.4.274-qgki-30957850-abG998USQSJHZB1

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Java (APK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK sanity (runner ya trae SDK; aceptar licencias para auto-NDK de gradle)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head -5
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null 2>&1 || true

      - name: Cache toolchains + prepare de out/ (mini: skip vmlinux)
        uses: actions/cache@v4
        with:
          path: |
            toolchains/
            out/ci-prepare/Module.symvers
            out/ci-prepare/System.map
            out/ci-prepare/.config
            out/ci-prepare/include/config/
            out/ci-prepare/include/generated/
            out/ci-prepare/scripts/
          key: v998u-${{ runner.os }}-${{ hashFiles('g998u/kernel-config/g998u-hzb1-resolved.config') }}
          restore-keys: v998u-${{ runner.os }}-
      - name: Kernel oficial + LKM + APK
        env:
          KERNEL_TARBALL_URL: https://github.com/Jean7z/dfroot-g998u/releases/download/osrc-hzb1/Kernel.tar.gz
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: bash g998u/ci/build.sh

      - name: Sanidad del vermagic + símbolos (resumen)
        run: |
          echo "kernel.release esperado: 5.4.274-qgki-30957850-abG998USQSJHZB1"
          ls -l app/src/main/assets/kko app/src/main/jni/ko/dirtyfrag-android15-5.4.ko dirtyfrag-g998u-debug.apk || true

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: g998u-hzb1-build
          path: |
            app/src/main/assets/kko
            app/src/main/jni/ko/dirtyfrag-android15-5.4.ko
            dirtyfrag-g998u-debug.apk
            out/ci-prepare/Module.symvers
            out/ci-prepare/System.map
          if-no-files-found: warn

# Notas de riesgo (ver PLAN.md):
# - config resuelta HZB1 (7522 entradas) retain 100% de vendor configs del árbol official.
# - symbol check aproxima desde System.map del árbol compilado — el device real puede trimar algo más.
# - NUNCA cargar los .ko en device fuera del foreground guard del exploit (panic/Odin).
