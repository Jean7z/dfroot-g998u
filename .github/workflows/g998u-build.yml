name: G998U kernel build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - 'g998u/kernel-config/**'
      - 'g998u/ci/build.sh'
      - 'kernel-ksu/**'
      - 'dfmod/**'
      - '.github/workflows/g998u-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: g998u-gradle-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}
          restore-keys: g998u-gradle-${{ runner.os }}-

      - name: Cache kernel toolchains and prepared tree
        uses: actions/cache@v4
        with:
          path: |
            toolchains/
            out/ci-prepare/Module.symvers
            out/ci-prepare/System.map
            out/ci-prepare/.config
            out/ci-prepare/include/config/
            out/ci-prepare/include/generated/
            out/ci-prepare/scripts/
            out/ci-prepare/arch/
            out/ci-prepare/security/
          key: g998u-kernel-osrc-hzb1-${{ runner.os }}-${{ hashFiles('g998u/kernel-config/g998u-hzb1-resolved.config') }}

      - name: Build target kernel payloads and APK
        env:
          KERNEL_TARBALL_URL: https://github.com/Jean7z/dfroot-g998u/releases/download/osrc-hzb1/Kernel.tar.gz
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: bash g998u/ci/build.sh

      - name: Verify target artifacts
        run: |
          expected='5.4.274-qgki-30957850-abG998USQSJHZB1'
          test -s app/src/main/assets/kko
          test -s app/src/main/jni/ko/dirtyfrag-android15-5.4.ko
          test -s dirtyfrag-g998u-debug.apk
          test -s out/ci-prepare/Module.symvers
          test -s out/ci-prepare/System.map
          strings app/src/main/assets/kko | grep -F "$expected"
          strings app/src/main/jni/ko/dirtyfrag-android15-5.4.ko | grep -F "$expected"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-g998u-hzb1
          path: |
            app/src/main/assets/kko
            app/src/main/jni/ko/dirtyfrag-android15-5.4.ko
            dirtyfrag-g998u-debug.apk
            out/ci-prepare/Module.symvers
            out/ci-prepare/System.map
          if-no-files-found: error
